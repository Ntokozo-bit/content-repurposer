<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RepurposerHub social preview</title>
  <desc id="desc">One idea becomes five platform-ready posts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#181928"/>
      <stop offset="0.58" stop-color="#5b5cf0"/>
      <stop offset="1" stop-color="#8a5df5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="250" fill="#fff" opacity="0.07"/>
  <circle cx="80" cy="650" r="270" fill="#ff7a59" opacity="0.12"/>
  <rect x="78" y="64" width="54" height="54" rx="16" fill="#fff"/>
  <text x="105" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#5b5cf0">R</text>
  <text x="150" y="101" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#fff">RepurposerHub</text>
  <text x="80" y="244" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#fff">One idea.</text>
  <text x="80" y="326" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#e6e6ff">Five native posts.</text>
  <text x="84" y="404" font-family="Arial, sans-serif" font-size="29" fill="#eeeeff">Turn one draft into platform-ready content for</text>
  <text x="84" y="449" font-family="Arial, sans-serif" font-size="29" fill="#eeeeff">X, LinkedIn, Instagram, Facebook and WhatsApp.</text>
  <rect x="735" y="105" width="385" height="420" rx="34" fill="#fff"/>
  <rect x="770" y="165" width="315" height="120" rx="20" fill="#f0f1f8"/>
  <text x="790" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5b5cf0">YOUR IDEA</text>
  <text x="790" y="238" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#202132">A strong idea should</text>
  <text x="790" y="268" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#202132">work harder for you.</text>
  <circle cx="927" cy="315" r="17" fill="#5b5cf0"/>
  <path d="M927 306v18m-7-7 7 7 7-7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="770" y="345" width="315" height="130" rx="20" fill="#fff" stroke="#e1e2eb" stroke-width="2"/>
  <rect x="790" y="366" width="42" height="42" rx="12" fill="#0a66c2"/>
  <text x="811" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">in</text>
  <text x="850" y="383" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#202132">You do not have</text>
  <text x="850" y="411" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#202132">an idea problem.</text>
  <text x="790" y="445" font-family="Arial, sans-serif" font-size="16" fill="#686a7c">You have a distribution problem.</text>
</svg>
